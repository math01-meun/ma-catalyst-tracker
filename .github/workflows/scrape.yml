name: Weekly Deal Scraper

on:
  schedule:
    - cron: '0 7 * * 1'   # tous les lundis a 7h UTC
  workflow_dispatch:        # bouton manuel "Run workflow" sur GitHub, pour tester

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4

      - name: Run wire scraper
        working-directory: ./scrapers
        run: python wire_us.py

      - name: Commit updated data
        run: |
          git config user.name "catalyst-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Weekly deal update [auto]"
          git push
